syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "github.com/MyProject273/Join_Love/pb/user";

message User {
  string id = 1;
  string user_name = 2;
  string email = 3;
  optional string phone = 4;
  string password_hash = 5;
  string role = 6;
  optional string full_name = 7;
  optional string gender = 8;
  google.protobuf.Timestamp birthdate = 9;
  optional string avatar_url = 10;
  optional string bio = 11;
  bool is_active = 12;
  bool is_verified = 13;
  google.protobuf.Timestamp last_login = 14;
  common.AuditFields audit_fields = 15;
}
