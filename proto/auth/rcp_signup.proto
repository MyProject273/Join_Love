syntax = "proto3";

package auth;

import "validate/validate.proto";
import "user/user.proto" ;

option go_package = "github.com/MyProject273/Join_Love/pb/auth";

message SignupRequest {
    string email = 1 [
        (validate.rules).string = {
            email: true,
            max_len: 100
        }
    ];
    
    string password = 2 [
        (validate.rules).string = {
            min_len: 6,
            pattern: "^[a-zA-Z0-9@$!%*?&]{6,}$"
        }
    ];

    string user_name = 3 [(validate.rules).string = {
        min_len: 3,
        max_len: 20,
        pattern: "^[a-zA-Z0-9_]+$"
    }];

}

message SignupResponse {
    user.User user = 1;
}

